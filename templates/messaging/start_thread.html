{% extends 'base.html' %}
{% block title %}Message {{ organizer.organization_name }}{% endblock %}
{% block content %}
<div class="container container-sm" style="padding-top:60px;padding-bottom:60px;">
  <h1 style="font-size:1.75rem;font-weight:800;margin-bottom:8px;">Message {{ organizer.organization_name }}</h1>
  <p style="color:var(--text-muted);margin-bottom:32px;">Your message will go directly to the organizer.</p>
  <div class="card">
    <div class="card-body card-body-lg">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Your Message *</label>
          <textarea name="body" rows="6" class="form-input" placeholder="Write your message..." required></textarea>
        </div>
        <div style="display:flex;gap:12px;">
          <button type="submit" class="btn btn-primary">Send Message</button>
          <a href="{% url 'organizers:public_profile' slug=organizer.slug %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
